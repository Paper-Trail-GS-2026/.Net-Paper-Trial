trigger:
  batch: true
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-24.04

variables:
  buildConfiguration: Release

steps:
  - checkout: self
    clean: true

  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet restore PaperTrail.sln
    displayName: Restore dependencies

  - script: dotnet build PaperTrail.sln --configuration $(buildConfiguration) --no-restore
    displayName: Build solution

  - script: dotnet test PaperTrail.sln --configuration $(buildConfiguration) --no-build --no-restore --logger trx --results-directory "$(Agent.TempDirectory)/test-results"
    displayName: Run tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: $(Agent.TempDirectory)/test-results
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
      testRunTitle: PaperTrail .NET

  - script: dotnet publish PaperTrail.API/PaperTrail.API.csproj --configuration $(buildConfiguration) --no-build --no-restore --property:UseAppHost=false --output "$(Build.BinariesDirectory)/publish"
    displayName: Publish API

  - task: ArchiveFiles@2
    displayName: Package API
    inputs:
      rootFolderOrFile: $(Build.BinariesDirectory)/publish
      includeRootFolder: false
      archiveType: zip
      archiveFile: $(Build.ArtifactStagingDirectory)/PaperTrail.API.zip

  - task: PublishPipelineArtifact@1
    displayName: Publish API artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/PaperTrail.API.zip
      artifact: api
